<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background-color: #121212;
    }

    /* Размытый фон по бокам для широкого экрана */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('WhatsApp Image 2026-09-09 at 01.15.25.jpeg') no-repeat center center / cover;
      filter: blur(25px) brightness(0.5);
      transform: scale(1.1);
      z-index: 1;
    }

    /* Четкое фото строго по центру в полном размере */
    .bg-image {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('WhatsApp Image 2026-09-09 at 01.15.25.jpeg') no-repeat center center / contain;
      z-index: 2;
    }

    /* Калькулятор по центру */
    .calculator {
      position: relative;
      z-index: 3;
      width: 320px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    .display {
      width: 100%;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 32px;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 20px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-operator {
      background: rgba(255, 153, 0, 0.7);
    }

    .btn-operator:hover {
      background: rgba(255, 153, 0, 0.9);
    }

    .btn-clear {
      background: rgba(235, 64, 52, 0.7);
    }

    .btn-clear:hover {
      background: rgba(235, 64, 52, 0.9);
    }

    .btn-equal {
      grid-column: span 2;
      background: rgba(52, 199, 89, 0.8);
    }

    .btn-equal:hover {
      background: rgba(52, 199, 89, 1);
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>

  <div class="calculator">
    <input type="text" class="display" id="display" readonly value="0">
    <div class="buttons">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="btn-operator" onclick="appendSymbol('/')">/</button>
      <button class="btn-operator" onclick="appendSymbol('*')">*</button>

      <button onclick="appendSymbol('7')">7</button>
      <button onclick="appendSymbol('8')">8</button>
      <button onclick="appendSymbol('9')">9</button>
      <button class="btn-operator" onclick="appendSymbol('-')">-</button>

      <button onclick="appendSymbol('4')">4</button>
      <button onclick="appendSymbol('5')">5</button>
      <button onclick="appendSymbol('6')">6</button>
      <button class="btn-operator" onclick="appendSymbol('+')">+</button>

      <button onclick="appendSymbol('1')">1</button>
      <button onclick="appendSymbol('2')">2</button>
      <button onclick="appendSymbol('3')">3</button>

      <button onclick="appendSymbol('.')">.</button>
      <button onclick="appendSymbol('0')">0</button>
      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendSymbol(symbol) {
      if (display.value === '0' && symbol !== '.') {
        display.value = symbol;
      } else {
        display.value += symbol;
      }
    }

    function clearDisplay() {
      display.value = '0';
    }

    function deleteLast() {
      if (display.value.length === 1) {
        display.value = '0';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch (error) {
        display.value = 'Ошибка';
        setTimeout(clearDisplay, 1500);
      }
    }
  </script>
</body>
</html>
